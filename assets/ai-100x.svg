<svg viewBox="0 0 1200 380" width="1200" height="380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The 100x QA stack: AI leverage on each QA activity — test data 10x, exploratory via MCP agent 8x, test code generation 6x, test-case design 5x, log triage 4x, bug reports 3x — compounding to roughly 100x throughput.">
  <defs>
    <linearGradient id="x100" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/><stop offset="55%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="14" fill="#0d1130"/>
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">🚀 The 100× QA Stack — AI leverage <tspan fill="#22d3ee">compounds</tspan></text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#dbe3f4">
    <!-- rows: label (right-anchored @285), bar track, animated fill, ×N chip -->
    <!-- row template y baseline -->
    <!-- Test data 10x = 740 -->
    <text x="285" y="82" text-anchor="end">Test data generation</text>
    <rect x="300" y="70" width="760" height="18" rx="9" fill="#161c38"/>
    <rect x="300" y="70" width="0" height="18" rx="9" fill="url(#x100)"><animate attributeName="width" from="0" to="740" dur="1.1s" begin="0.2s" fill="freeze"/></rect>
    <text x="1052" y="83" font-size="13" font-weight="800" fill="#67e8f9">×10</text>

    <!-- Exploratory (MCP agent) 8x = 592 -->
    <text x="285" y="122" text-anchor="end">Exploratory via MCP agent</text>
    <rect x="300" y="110" width="760" height="18" rx="9" fill="#161c38"/>
    <rect x="300" y="110" width="0" height="18" rx="9" fill="url(#x100)"><animate attributeName="width" from="0" to="592" dur="1.1s" begin="0.4s" fill="freeze"/></rect>
    <text x="904" y="123" font-size="13" font-weight="800" fill="#67e8f9">×8</text>

    <!-- Test code generation 6x = 444 -->
    <text x="285" y="162" text-anchor="end">Test code generation</text>
    <rect x="300" y="150" width="760" height="18" rx="9" fill="#161c38"/>
    <rect x="300" y="150" width="0" height="18" rx="9" fill="url(#x100)"><animate attributeName="width" from="0" to="444" dur="1.1s" begin="0.6s" fill="freeze"/></rect>
    <text x="756" y="163" font-size="13" font-weight="800" fill="#67e8f9">×6</text>

    <!-- Test-case design 5x = 370 -->
    <text x="285" y="202" text-anchor="end">Test-case design</text>
    <rect x="300" y="190" width="760" height="18" rx="9" fill="#161c38"/>
    <rect x="300" y="190" width="0" height="18" rx="9" fill="url(#x100)"><animate attributeName="width" from="0" to="370" dur="1.1s" begin="0.8s" fill="freeze"/></rect>
    <text x="682" y="203" font-size="13" font-weight="800" fill="#67e8f9">×5</text>

    <!-- Log / trace triage 4x = 296 -->
    <text x="285" y="242" text-anchor="end">Log / trace triage</text>
    <rect x="300" y="230" width="760" height="18" rx="9" fill="#161c38"/>
    <rect x="300" y="230" width="0" height="18" rx="9" fill="url(#x100)"><animate attributeName="width" from="0" to="296" dur="1.1s" begin="1.0s" fill="freeze"/></rect>
    <text x="608" y="243" font-size="13" font-weight="800" fill="#67e8f9">×4</text>

    <!-- Bug report drafting 3x = 222 -->
    <text x="285" y="282" text-anchor="end">Bug report drafting</text>
    <rect x="300" y="270" width="760" height="18" rx="9" fill="#161c38"/>
    <rect x="300" y="270" width="0" height="18" rx="9" fill="url(#x100)"><animate attributeName="width" from="0" to="222" dur="1.1s" begin="1.2s" fill="freeze"/></rect>
    <text x="534" y="283" font-size="13" font-weight="800" fill="#67e8f9">×3</text>
  </g>

  <!-- compounding callout -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="330" font-size="17" font-weight="800" fill="#f1f5f9">Stack them across your day → <tspan fill="#a78bfa">≈ 100× throughput</tspan>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="356" font-size="13" fill="#7d89ad">AI removes the toil · you keep the judgment — the verdict is always yours</text>
  </g>
</svg>
