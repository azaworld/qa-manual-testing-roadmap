<svg viewBox="0 0 1200 420" width="1200" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QA career ladder: Trainee, Junior, Mid-level, Senior, Lead — then branching to Manager, Architect, TPM or Product">
  <rect width="1200" height="420" rx="14" fill="#0d1130"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">🪜 The QA Career Ladder</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="80" y="330" width="190" height="50" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="175" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#86efac">TRAINEE</text>
    <text x="175" y="370" text-anchor="middle" font-size="11.5" fill="#93a0c2">execute cases reliably</text>

    <rect x="290" y="270" width="190" height="110" rx="8" fill="#153a4d" stroke="#22d3ee" stroke-width="2"/>
    <text x="385" y="294" text-anchor="middle" font-size="16" font-weight="700" fill="#67e8f9">JUNIOR QA</text>
    <text x="385" y="312" text-anchor="middle" font-size="11.5" fill="#93a0c2">write cases · clean bug reports</text>

    <rect x="500" y="210" width="190" height="170" rx="8" fill="#1e2a52" stroke="#60a5fa" stroke-width="2"/>
    <text x="595" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">MID-LEVEL</text>
    <text x="595" y="252" text-anchor="middle" font-size="11.5" fill="#93a0c2">own a feature area · API + DB</text>

    <rect x="710" y="150" width="190" height="230" rx="8" fill="#2a1e52" stroke="#a78bfa" stroke-width="2"/>
    <text x="805" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">SENIOR QA</text>
    <text x="805" y="192" text-anchor="middle" font-size="11.5" fill="#93a0c2">risk calls · mentoring · "can we ship?"</text>

    <rect x="920" y="90" width="190" height="290" rx="8" fill="#3d1533" stroke="#f472b6" stroke-width="2"/>
    <text x="1015" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#f9a8d4">QA LEAD</text>
    <text x="1015" y="132" text-anchor="middle" font-size="11.5" fill="#93a0c2">people · strategy · hiring</text>
    <text x="1015" y="160" text-anchor="middle" font-size="12" fill="#f9a8d4">then it branches ↑</text>
    <text x="1015" y="185" text-anchor="middle" font-size="11.5" fill="#dbe3f4">QA Manager · SDET/Architect</text>
    <text x="1015" y="203" text-anchor="middle" font-size="11.5" fill="#dbe3f4">TPM/Delivery · Product</text>

    <!-- climber loops up the ladder forever -->
    <text font-size="24">🧗
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
        path="M 175 320 L 385 260 L 595 200 L 805 140 L 1015 78 L 1015 78"
        keyPoints="0;0.22;0.44;0.66;0.88;1" keyTimes="0;0.22;0.44;0.66;0.88;1"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.85;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- promotion labels -->
    <g font-size="11.5" fill="#7d89ad" text-anchor="middle">
      <text x="280" y="300">skill</text>
      <text x="490" y="240">judgment</text>
      <text x="700" y="180">influence</text>
      <text x="910" y="120">people &amp; systems</text>
    </g>
  </g>
  <text x="600" y="405" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7d89ad">each jump needs something different — the chapters below tell you exactly what</text>
</svg>
