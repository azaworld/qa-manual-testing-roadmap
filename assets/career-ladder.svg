<svg viewBox="0 0 1200 430" width="1200" height="430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QA career ladder: Trainee → Junior → Mid-level → Senior → Lead, then branching to Manager, Architect, TPM or Product. Each jump needs skill, then judgment, then influence, then people and systems.">
  <rect width="1200" height="430" rx="14" fill="#0d1130"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">🪜 The QA Career Ladder</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- staircase boxes, all bottoms on baseline y=372, tops rising -->
    <!-- TRAINEE -->
    <rect x="72" y="312" width="188" height="60" rx="9" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <rect x="72" y="312" width="188" height="60" rx="9" fill="#22c55e" opacity="0"><animate attributeName="opacity" values="0;0.3;0;0;0" keyTimes="0;0.1;0.2;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <text x="166" y="338" font-size="15" font-weight="700" fill="#86efac">TRAINEE</text>
    <text x="166" y="357" font-size="11.5" fill="#9fb0cc">execute cases reliably</text>

    <!-- JUNIOR -->
    <rect x="284" y="272" width="188" height="100" rx="9" fill="#123a4d" stroke="#22d3ee" stroke-width="2"/>
    <rect x="284" y="272" width="188" height="100" rx="9" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.2;0.3;0.4;1" dur="8s" repeatCount="indefinite"/></rect>
    <text x="378" y="300" font-size="15" font-weight="700" fill="#67e8f9">JUNIOR QA</text>
    <text x="378" y="319" font-size="11.5" fill="#9fb0cc">write cases · clean bug reports</text>

    <!-- MID -->
    <rect x="496" y="228" width="188" height="144" rx="9" fill="#1e2a52" stroke="#60a5fa" stroke-width="2"/>
    <rect x="496" y="228" width="188" height="144" rx="9" fill="#60a5fa" opacity="0"><animate attributeName="opacity" values="0;0;0.28;0;0" keyTimes="0;0.4;0.5;0.6;1" dur="8s" repeatCount="indefinite"/></rect>
    <text x="590" y="256" font-size="15" font-weight="700" fill="#93c5fd">MID-LEVEL</text>
    <text x="590" y="275" font-size="11.5" fill="#9fb0cc">own a feature area · API + DB</text>

    <!-- SENIOR -->
    <rect x="708" y="176" width="188" height="196" rx="9" fill="#2a1e52" stroke="#a78bfa" stroke-width="2"/>
    <rect x="708" y="176" width="188" height="196" rx="9" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.26;0;0" keyTimes="0;0.6;0.7;0.8;1" dur="8s" repeatCount="indefinite"/></rect>
    <text x="802" y="204" font-size="15" font-weight="700" fill="#c4b5fd">SENIOR QA</text>
    <text x="802" y="223" font-size="11.5" fill="#9fb0cc">risk calls · mentoring</text>
    <text x="802" y="240" font-size="11.5" fill="#9fb0cc">the "can we ship?" call</text>

    <!-- QA LEAD -->
    <rect x="920" y="104" width="200" height="268" rx="9" fill="#3d1533" stroke="#f472b6" stroke-width="2"/>
    <rect x="920" y="104" width="200" height="268" rx="9" fill="#f472b6" opacity="0"><animate attributeName="opacity" values="0;0;0.24;0;0" keyTimes="0;0.8;0.9;0.96;1" dur="8s" repeatCount="indefinite"/></rect>
    <text x="1020" y="132" font-size="15" font-weight="700" fill="#f9a8d4">QA LEAD</text>
    <text x="1020" y="151" font-size="11.5" fill="#9fb0cc">people · strategy · hiring</text>
    <line x1="945" y1="168" x2="1095" y2="168" stroke="#5a2a48" stroke-width="1"/>
    <text x="1020" y="192" font-size="12" fill="#f9a8d4">then it branches →</text>
    <text x="1020" y="214" font-size="11.5" fill="#dbe3f4">QA Manager</text>
    <text x="1020" y="231" font-size="11.5" fill="#dbe3f4">SDET / Architect</text>
    <text x="1020" y="248" font-size="11.5" fill="#dbe3f4">TPM / Delivery</text>
    <text x="1020" y="265" font-size="11.5" fill="#dbe3f4">Product</text>

    <!-- upward arrows in the clear space above each shorter box (no overlap) -->
    <g fill="#5b6690" font-size="18" font-weight="700">
      <text x="272" y="300">↗</text>
      <text x="484" y="256">↗</text>
      <text x="696" y="204">↗</text>
      <text x="908" y="152">↗</text>
    </g>
  </g>

  <!-- baseline -->
  <line x1="60" y1="374" x2="1130" y2="374" stroke="#28304f" stroke-width="1.5"/>

  <!-- progression caption (clean, below the ladder — no overlap) -->
  <text x="600" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c7cfe8">Each jump up demands something new: <tspan fill="#67e8f9" font-weight="700">skill</tspan> → <tspan fill="#93c5fd" font-weight="700">judgment</tspan> → <tspan fill="#c4b5fd" font-weight="700">influence</tspan> → <tspan fill="#f9a8d4" font-weight="700">people &amp; systems</tspan></text>
  <text x="600" y="419" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7d89ad">the chapters tell you exactly what each one takes</text>
</svg>
